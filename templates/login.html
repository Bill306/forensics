<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Forensic Stock Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0c1410;
    --bg-panel: #121c18;
    --bg-elev: #182521;
    --ink: #e8e4d8;
    --ink-dim: #9ca39a;
    --ink-faint: #6b726b;
    --rule: #1f2a25;
    --rule-hi: #2f3d36;
    --amber: #d4a93e;
    --red: #d4574a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.55;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
    opacity: 0.02; pointer-events: none; z-index: 1; mix-blend-mode: overlay;
  }
  .card {
    width: 100%; max-width: 440px;
    background: var(--bg-panel);
    border: 1px solid var(--rule);
    padding: 44px 40px 36px;
    position: relative; z-index: 2;
  }
  .kicker {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--amber); letter-spacing: 0.2em;
    text-transform: uppercase; margin-bottom: 16px;
    text-align: center;
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 400;
    font-size: 32px; line-height: 1.1; letter-spacing: -0.01em;
    text-align: center; margin-bottom: 8px;
  }
  h1 em { font-style: italic; color: var(--amber); font-weight: 300; }
  .sub {
    font-family: 'Fraunces', serif; font-style: italic;
    font-size: 14px; color: var(--ink-dim);
    text-align: center; margin-bottom: 32px;
  }
  form {
    display: flex; flex-direction: column; gap: 14px;
  }
  label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    color: var(--ink-faint); letter-spacing: 0.16em;
    text-transform: uppercase; margin-bottom: -8px;
  }
  input[type="password"] {
    background: var(--bg-deep); border: 1px solid var(--rule-hi);
    color: var(--ink); padding: 16px 20px;
    font-family: 'JetBrains Mono', monospace; font-size: 16px;
    letter-spacing: 0.05em; outline: none;
    transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: var(--amber); }
  button {
    padding: 16px 28px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase;
    background: var(--amber); color: var(--bg-deep); border: none;
    cursor: pointer; transition: all 0.15s;
    margin-top: 4px;
  }
  button:hover { background: #f2c850; transform: translateY(-1px); }
  .error {
    color: var(--red); font-family: 'JetBrains Mono', monospace;
    font-size: 11px; padding: 10px 14px;
    background: rgba(212, 87, 74, 0.08);
    border-left: 2px solid var(--red);
    letter-spacing: 0.04em;
  }
  .footnote {
    margin-top: 28px; padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    color: var(--ink-faint); letter-spacing: 0.12em;
    text-transform: uppercase; text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="kicker">Forensic Stock Chart</div>
  <h1>Sign <em>in</em></h1>
  <p class="sub">Enter the shared password to continue.</p>

  {% if error %}
    <div class="error">⚠ {{ error }}</div>
    <div style="height: 12px;"></div>
  {% endif %}

  <form method="post" action="/login">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" autofocus required>
    <button type="submit">Continue →</button>
  </form>

  <div class="footnote">Built on Claude Agent SDK</div>
</div>

</body>
</html>
