<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="1400" height="900" fill="#0c1410"/>

  <!-- masthead -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4a93e" letter-spacing="2.2px">FORENSIC STOCK CHART · BUILT ON CLAUDE AGENT SDK</text>
    <text x="0" y="50" font-family="Georgia, serif" font-size="36" fill="#e8e4d8" font-weight="400">Type a <tspan fill="#d4a93e" font-style="italic" font-weight="300">ticker</tspan>. Get the <tspan fill="#d4a93e" font-style="italic" font-weight="300">full forensic.</tspan></text>
    <g transform="translate(1100, 38)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b726b" letter-spacing="1.4px" text-anchor="end">RATE LIMITS</text>
      <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6b726b" letter-spacing="1.4px" text-anchor="end"><tspan fill="#d4a93e" font-weight="500">10/DAY</tspan> CHARTS</text>
      <g transform="translate(40, 38)">
        <rect x="0" y="0" width="100" height="32" fill="none" stroke="#2f3d36"/>
        <text x="50" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9ca39a" text-anchor="middle" letter-spacing="1.6px">SIGN OUT</text>
      </g>
    </g>
    <line x1="0" y1="100" x2="1280" y2="100" stroke="#1f2a25"/>
  </g>

  <!-- search (faded since we're past it) -->
  <g transform="translate(60, 200)" opacity="0.5">
    <rect x="0" y="0" width="1280" height="100" fill="#121c18" stroke="#1f2a25"/>
    <rect x="32" y="20" width="1080" height="58" fill="#0c1410" stroke="#2f3d36"/>
    <text x="52" y="56" font-family="'JetBrains Mono', monospace" font-size="18" fill="#e8e4d8" letter-spacing="0.9">NVDA</text>
    <g transform="translate(1132, 20)">
      <rect x="0" y="0" width="116" height="58" fill="#2f3d36"/>
      <text x="58" y="35" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca39a" text-anchor="middle" letter-spacing="1.8px">LOOK UP</text>
    </g>
  </g>

  <!-- ============== WORKING STATE ============== -->
  <g transform="translate(60, 332)">
    <rect x="0" y="0" width="1280" height="380" fill="#121c18" stroke="#1f2a25"/>

    <!-- centered content -->
    <g transform="translate(640, 70)">
      <!-- spinner + label -->
      <g transform="translate(-130, 0)">
        <circle cx="0" cy="0" r="7" fill="none" stroke="#d4a93e" stroke-width="2" stroke-dasharray="20 10">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        </circle>
        <text x="16" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4a93e" letter-spacing="2.2px">CLAUDE IS WORKING</text>
      </g>

      <!-- big title -->
      <text y="56" font-family="Georgia, serif" font-size="32" fill="#e8e4d8" text-anchor="middle"><tspan fill="#d4a93e" font-style="italic" font-weight="300">Researching</tspan> the forensic record</text>

      <!-- subtitle -->
      <text y="92" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#9ca39a" text-anchor="middle">This typically takes 2–5 minutes. Claude is reading the skill, pulling price data,</text>
      <text y="112" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#9ca39a" text-anchor="middle">and curating events from the web.</text>

      <!-- timer -->
      <text y="180" font-family="'JetBrains Mono', monospace" font-size="32" fill="#d4a93e" text-anchor="middle" letter-spacing="3px">02:14</text>

      <!-- stages -->
      <g transform="translate(0, 220)">
        <text x="-150" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6b726b" text-anchor="middle" letter-spacing="1.4px">RESEARCH</text>
        <line x1="-90" y1="-4" x2="-90" y2="6" stroke="#2f3d36"/>
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d4a93e" text-anchor="middle" letter-spacing="1.4px">DATA</text>
        <line x1="60" y1="-4" x2="60" y2="6" stroke="#2f3d36"/>
        <text x="150" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6b726b" text-anchor="middle" letter-spacing="1.4px">RENDER</text>
      </g>
    </g>
  </g>

  <!-- ============== FOOTER ============== -->
  <g transform="translate(60, 850)">
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#1f2a25"/>
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b726b" letter-spacing="1px">POWERED BY · CLAUDE AGENT SDK + FORENSIC-PRICE-CHART SKILL</text>
    <text x="1280" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b726b" letter-spacing="1px" text-anchor="end">NOT INVESTMENT ADVICE</text>
  </g>
</svg>
