    <!-- 4 cells -->
    <g transform="translate(32, 86)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6b726b" letter-spacing="1.5px">LATEST PRICE</text>
        <text x="0" y="32" font-family="Georgia, serif" font-size="28" fill="#d4a93e">$850.00</text>
